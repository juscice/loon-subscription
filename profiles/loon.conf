[General]
# 2026-10-05：按当前 Loon 官方配置文档整理；使用最新版 Loon。
# 直连/绕过域名不会隐藏 iOS VPN 状态；银行仍提示 VPN 时需关闭 Loon。
# 面向中国大陆用户：国内服务直连，境外服务按独立策略分流。
dns-server = system
doh-server = https://dns.alidns.com/dns-query
ip-mode = dual
sni-sniffing = true
disable-stun = false
dns-reject-mode = LOOPBACKIP
domain-reject-mode = DNS
udp-fallback-mode = REJECT
allow-wifi-access = false
wifi-access-http-port = 8080
wifi-access-socks5-port = 8081
interface-mode = Auto
test-timeout = 5
disconnect-on-policy-change = false
internet-test-url = http://connect.aliyun.com/generate_204
proxy-test-url = http://cp.cloudflare.com/generate_204
resource-parser = https://github.com/sub-store-org/Sub-Store/releases/latest/download/sub-store-parser.loon.min.js
geoip-url = https://geodata.kelee.one/Country-Masaiki.mmdb
ipasn-url = https://geodata.kelee.one/GeoLite2-ASN-P3TERX.mmdb
# 银行/支付域名同时绕过 HTTP Proxy 和 TUN；不添加银行动态 IP/CDN 段。
